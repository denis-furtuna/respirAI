<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" width="820" height="640" role="img" aria-label="respirAI enclosure layout" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>respirAI enclosure layout</title>
  <desc>Top view of the base layer showing the acoustic chamber, microphone pocket, XIAO board, battery compartment and screw bosses; top view of the lid showing the LED matrix window and branding recess; and a side section showing the internal stack heights.</desc>

  <!-- PANEL A : BASE LAYER -->
  <text x="60" y="40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">A — BASE LAYER (top view)</text>
  <text x="60" y="58" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">100 × 85 mm · scale 3 px/mm</text>

  <rect x="60" y="70" width="300" height="255" rx="24" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>

  <!-- acoustic chamber + mic : X 6..32, Y 14..40 (mm from bottom-left) -->
  <rect x="78" y="205" width="78" height="78" rx="8" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
  <circle cx="117" cy="244" r="20" fill="none" stroke="#14B8A6" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="117" y="248" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0F172A">MIC</text>

  <!-- XIAO : X 4..25, Y 46..64 -->
  <rect x="72" y="133" width="63" height="54" rx="4" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
  <text x="103" y="164" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0F172A">XIAO</text>

  <!-- battery : X 30..90, Y 22..72 -->
  <rect x="150" y="109" width="180" height="150" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="240" y="180" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0F172A">LiPo 2500 mAh</text>
  <text x="240" y="196" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">60 × 50 × 8 mm</text>

  <!-- screw bosses -->
  <circle cx="84" cy="301" r="9" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <circle cx="336" cy="301" r="9" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <circle cx="84" cy="94" r="9" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <circle cx="336" cy="94" r="9" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>

  <!-- USB-C cutout on left wall -->
  <rect x="55" y="146" width="10" height="28" fill="#0EA5E9"/>
  <text x="48" y="164" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#0EA5E9">USB-C</text>

  <!-- switch slot on front wall -->
  <rect x="180" y="320" width="27" height="10" fill="#D97706"/>
  <text x="193" y="348" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#D97706">switch</text>

  <!-- barb callout -->
  <line x1="117" y1="244" x2="30" y2="244" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="28" y="240" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#14B8A6">barb below</text>

  <!-- finger recess -->
  <path d="M360 170 q-16 28 0 56" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="372" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">finger recess</text>

  <!-- PANEL B : LID -->
  <text x="460" y="40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">B — LID (top view)</text>
  <text x="460" y="58" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">diffuser window + branding</text>

  <rect x="460" y="70" width="300" height="255" rx="24" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>

  <!-- matrix window : 64x64mm centered, Y 12..76 -->
  <rect x="514" y="97" width="192" height="192" rx="6" fill="#CFFAFE" stroke="#0EA5E9" stroke-width="2"/>
  <text x="610" y="186" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A">LED matrix window</text>
  <text x="610" y="204" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">64 × 64 mm + diffuser</text>

  <!-- branding recess strip -->
  <rect x="550" y="297" width="120" height="18" rx="4" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="610" y="310" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">respirAI</text>

  <!-- screw holes -->
  <circle cx="484" cy="301" r="6" fill="none" stroke="#64748B" stroke-width="2"/>
  <circle cx="736" cy="301" r="6" fill="none" stroke="#64748B" stroke-width="2"/>
  <circle cx="484" cy="94" r="6" fill="none" stroke="#64748B" stroke-width="2"/>
  <circle cx="736" cy="94" r="6" fill="none" stroke="#64748B" stroke-width="2"/>

  <!-- PANEL C : SIDE SECTION -->
  <text x="60" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">C — SIDE SECTION (stack, 24 mm total)</text>

  <rect x="60" y="420" width="700" height="14" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5"/>
  <text x="770" y="431" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="end">lid 2 mm</text>

  <rect x="200" y="434" width="300" height="6" fill="#CFFAFE" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="510" y="441" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#0EA5E9">diffuser 0.6 mm</text>

  <rect x="200" y="440" width="300" height="12" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="510" y="451" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#0EA5E9">LED matrix 3 mm</text>

  <rect x="330" y="456" width="240" height="30" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="580" y="475" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#D97706">battery 8 mm</text>

  <!-- funnel -->
  <path d="M100 520 L100 470 L160 470 L160 520 L136 520 L136 496 L124 496 L124 520 Z" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="170" y="486" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#14B8A6">acoustic funnel + sealed mic pocket</text>

  <rect x="60" y="520" width="700" height="14" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5"/>
  <text x="770" y="531" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="end">base 2 mm</text>

  <!-- barb sticking out below -->
  <rect x="112" y="534" width="36" height="46" rx="4" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
  <text x="160" y="562" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#14B8A6">barb / push-in fitting → stethoscope tube</text>

  <text x="60" y="612" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">All dimensions are design intent. Confirm every component against cad/components.csv before modelling.</text>
</svg>
