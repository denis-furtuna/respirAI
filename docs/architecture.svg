<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="respirAI system architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>respirAI system architecture</title>
  <desc>The stethoscope device streams lung sounds over Bluetooth to a phone, which uploads a recording to an inference server and displays the result. The model is trained offline on the ICBHI respiratory sound database.</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="24" y="70" width="180" height="96" rx="12" fill="#F0FDFA" stroke="#14B8A6" stroke-width="2"/>
  <text x="114" y="104" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0F172A">Device</text>
  <text x="114" y="128" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">XIAO ESP32-S3 + INMP441</text>
  <text x="114" y="148" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">stethoscope bell + tube</text>

  <line x1="204" y1="118" x2="272" y2="118" stroke="#64748B" stroke-width="2" marker-end="url(#arw)"/>
  <text x="238" y="104" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">BLE</text>
  <text x="238" y="140" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">8 kHz PCM</text>

  <rect x="280" y="70" width="180" height="96" rx="12" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2"/>
  <text x="370" y="104" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0F172A">Phone</text>
  <text x="370" y="128" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">chest map, waveform</text>
  <text x="370" y="148" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">guided recording</text>

  <line x1="460" y1="106" x2="528" y2="106" stroke="#64748B" stroke-width="2" marker-end="url(#arw)"/>
  <text x="494" y="94" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">WAV</text>
  <line x1="528" y1="132" x2="460" y2="132" stroke="#64748B" stroke-width="2" marker-end="url(#arw)"/>
  <text x="494" y="152" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">JSON result</text>

  <rect x="536" y="70" width="200" height="96" rx="12" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2"/>
  <text x="636" y="104" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0F172A">Inference</text>
  <text x="636" y="128" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">mel spectrogram + CNN</text>
  <text x="636" y="148" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">normal / crackles / wheezes</text>

  <line x1="636" y1="238" x2="636" y2="176" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="652" y="212" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">trained model</text>

  <rect x="536" y="240" width="200" height="44" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="636" y="267" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Training — ICBHI 2017</text>
</svg>
